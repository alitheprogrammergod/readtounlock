name: Read to Unlock V2 logic tests
on:
  pull_request:
  push:
    branches:
      - development/read-to-unlock-v2
jobs:
  test-goal-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npx tsc -p tsconfig.v2-core.json
      - run: node --test tests/reading-unlock.test.cjs
      - run: npx tsc --noEmit
